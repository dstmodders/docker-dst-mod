name: CI

permissions:
  contents: read

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      build-fields-pending: ${{ steps.set-matrix.outputs.build-fields-pending }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set matrix
        id: set-matrix
        run: |
          json="$(cat ./versions.json)"
          matrix="$(jq -cM . <<< "$json")"
          {
            echo "matrix=${matrix}"
            echo "build-fields-pending<<EOF"
            jq -r '.[] | "IM \(.imagemagick_version) / ktools \(.ktools_version) / klei-tools \(.klei_tools_version): Pending..."' <<< "$matrix"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check for docker-related changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docker:
              - 'alpine/**'
              - 'debian/**'
              - '.github/workflows/ci.yml'
              - 'versions.json'

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 20.18.0
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ github.event_name != 'pull_request' }}
        id: slack
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: Checking...
            Prettier issues: Checking...
            ShellCheck issues: Checking...
          status: in-progress
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint using Prettier
        run: pnpm exec prettier --check . || true
      - name: Output Prettier results
        id: prettier
        run: echo "issues=$(pnpm exec prettier --list-different . | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Lint using Hadolint (Alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-alpine
        with:
          dockerfile: ./alpine/Dockerfile
          no-fail: true
      - name: Lint using Hadolint (Debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-debian
        with:
          dockerfile: ./debian/Dockerfile
          no-fail: true
      - name: Output Hadolint results
        id: hadolint
        run: |
          alpine_issues="$(echo '${{ steps.hadolint-alpine.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          debian_issues="$(echo '${{ steps.hadolint-debian.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"

          {
            echo "alpine-issues=$alpine_issues"
            echo "debian-issues=$debian_issues"
            echo "issues=$((alpine_issues + debian_issues))"
          } >> "$GITHUB_OUTPUT"
      - name: Lint using ShellCheck
        run: pnpm lint:shellcheck || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Output ShellCheck results
        id: shellcheck
        run: echo "issues=$(pnpm exec shellcheck -f gcc bin/*.sh 2>&1 | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Check results
        run: |
          hadolint_alpine_issues="${{ steps.hadolint.outputs.alpine-issues }}"
          hadolint_debian_issues="${{ steps.hadolint.outputs.debian-issues }}"
          hadolint_issues="${{ steps.hadolint.outputs.issues }}"
          prettier_issues="${{ steps.prettier.outputs.issues }}"
          shellcheck_issues="${{ steps.shellcheck.outputs.issues }}"

          echo "Hadolint issues (Alpine): $hadolint_alpine_issues"
          echo "Hadolint issues (Debian): $hadolint_debian_issues"
          echo "Total Hadolint issues: $hadolint_issues"
          echo "Total Prettier issues: $prettier_issues"
          echo "Total ShellCheck issues: $shellcheck_issues"

          exit_code=1
          if [ "$prettier_issues" = '0' ] && [ "$hadolint_issues" = '0' ] && [ "$shellcheck_issues" = '0' ]; then
            exit_code=0
          fi
          exit "$exit_code"
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ github.event_name != 'pull_request' && always() }}
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: ${{ steps.hadolint.outputs.issues || 'Skipped' }}
            Prettier issues: ${{ steps.prettier.outputs.issues || 'Skipped' }}
            ShellCheck issues: ${{ steps.shellcheck.outputs.issues || 'Skipped' }}
          status: ${{ job.status }}
          timestamp: ${{ steps.slack.outputs.slack-timestamp }}

  build-notify:
    needs: [changes, prepare]
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'pull_request' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    outputs:
      slack-timestamp: ${{ steps.slack.outputs.slack-timestamp }}
    steps:
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        id: slack
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields: |
            {STATUS}
            {REF}
            ${{ needs.prepare.outputs.build-fields-pending }}
          status: in-progress

  build:
    needs: [changes, prepare, build-notify]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.prepare.result == 'success' && needs.changes.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.changes.outputs.docker == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build an Alpine image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            IMAGEMAGICK_VERSION=${{ matrix.image.imagemagick_version }}
            KTOOLS_VERSION=${{ matrix.image.ktools_version }}
          context: .
          file: ./alpine/Dockerfile
          labels: maintainer=victor@popkov.me
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            alpine-${{ matrix.image.imagemagick_version }}-ktools-${{ matrix.image.ktools_version }}
      - name: Build a Debian image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          build-args: |
            KLEI_TOOLS_VERSION=${{ matrix.image.klei_tools_version }}
            KTOOLS_VERSION=${{ matrix.image.ktools_version }}
          context: .
          file: ./debian/Dockerfile
          labels: maintainer=victor@popkov.me
          load: true
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            debian-${{ matrix.image.klei_tools_version }}-ktools-${{ matrix.image.ktools_version }}
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ always() && needs.build-notify.outputs.slack-timestamp != '' }}
        continue-on-error: true
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          fields-mode: merge
          ignore-failures: true
          preserve-color: true
          fields: |
            IM ${{ matrix.image.imagemagick_version }} / ktools ${{ matrix.image.ktools_version }} / klei-tools ${{ matrix.image.klei_tools_version }}: ${{ job.status == 'success' && 'Success' || job.status == 'cancelled' && 'Cancelled' || job.status == 'skipped' && 'Skipped' || 'Failure' }}
          timestamp: ${{ needs.build-notify.outputs.slack-timestamp }}
      - name: Save Slack field outcome
        if: ${{ always() }}
        run: |
          case "${{ job.status }}" in
            success) value=Success ;;
            cancelled) value=Cancelled ;;
            skipped) value=Skipped ;;
            *) value=Failure ;;
          esac
          mkdir -p .slack-field
          printf 'IM %s / ktools %s / klei-tools %s: %s\n' \
            '${{ matrix.image.imagemagick_version }}' \
            '${{ matrix.image.ktools_version }}' \
            '${{ matrix.image.klei_tools_version }}' \
            "$value" > .slack-field/field.txt
      - name: Upload Slack field outcome
        if: ${{ always() && needs.build-notify.outputs.slack-timestamp != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: slack-field-ci-build-${{ matrix.image.imagemagick_version }}-klei-${{ matrix.image.klei_tools_version }}-ktools-${{ matrix.image.ktools_version }}
          path: .slack-field/field.txt
          if-no-files-found: error
          retention-days: 1

  build-finalize:
    needs: [build-notify, build]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.build-notify.result == 'success' }}
    steps:
      - name: Download Slack field outcomes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: slack-field-ci-build-*
          path: slack-fields
      - name: Assemble Slack fields
        id: fields
        run: |
          {
            echo 'fields<<EOF'
            find slack-fields -type f -name field.txt | sort | while read -r f; do cat "$f"; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Finalize Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        with:
          text: GitHub Actions <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|${{ github.workflow }} / build> job in {GITHUB_REF} by {GITHUB_ACTOR}
          color: ${{ needs.build.result == 'success' && '#24a943' || needs.build.result == 'cancelled' && '#1f242b' || '#cc1f2d' }}
          fields: |
            {STATUS}
            {REF}
            ${{ steps.fields.outputs.fields }}
          status: ${{ needs.build.result == 'success' && 'success' || needs.build.result == 'cancelled' && 'cancelled' || 'failure' }}
          timestamp: ${{ needs.build-notify.outputs.slack-timestamp }}
