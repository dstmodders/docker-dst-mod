name: CI

permissions:
  contents: read

concurrency:
  group: CI-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

env:
  SLACK_CHANNEL: ${{ secrets.SLACK_CHANNEL }}
  SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
  SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        id: node
        with:
          node-version: 20.18.0
      - name: Send Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ github.event_name != 'pull_request' }}
        id: slack
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: Checking...
            Prettier issues: Checking...
            ShellCheck issues: Checking...
          status: in-progress
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint using Prettier
        run: pnpm exec prettier --check . || true
      - name: Output Prettier results
        id: prettier
        run: echo "issues=$(pnpm exec prettier --list-different . | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Lint using Hadolint (Alpine)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-alpine
        with:
          dockerfile: ./alpine/Dockerfile
          no-fail: true
      - name: Lint using Hadolint (Debian)
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        id: hadolint-debian
        with:
          dockerfile: ./debian/Dockerfile
          no-fail: true
      - name: Output Hadolint results
        id: hadolint
        run: |
          alpine_issues="$(echo '${{ steps.hadolint-alpine.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"
          debian_issues="$(echo '${{ steps.hadolint-debian.outputs.results }}' | sed '/^$/d' | sed '$!N; /^\n$/D' | wc -l)"

          {
            echo "alpine-issues=$alpine_issues"
            echo "debian-issues=$debian_issues"
            echo "issues=$((alpine_issues + debian_issues))"
          } >> "$GITHUB_OUTPUT"
      - name: Lint using ShellCheck
        run: pnpm lint:shellcheck || true
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Output ShellCheck results
        id: shellcheck
        run: echo "issues=$(pnpm exec shellcheck -f gcc bin/*.sh 2>&1 | wc -l)" >> "$GITHUB_OUTPUT"
      - name: Check results
        run: |
          hadolint_alpine_issues="${{ steps.hadolint.outputs.alpine-issues }}"
          hadolint_debian_issues="${{ steps.hadolint.outputs.debian-issues }}"
          hadolint_issues="${{ steps.hadolint.outputs.issues }}"
          prettier_issues="${{ steps.prettier.outputs.issues }}"
          shellcheck_issues="${{ steps.shellcheck.outputs.issues }}"

          echo "Hadolint issues (Alpine): $hadolint_alpine_issues"
          echo "Hadolint issues (Debian): $hadolint_debian_issues"
          echo "Total Hadolint issues: $hadolint_issues"
          echo "Total Prettier issues: $prettier_issues"
          echo "Total ShellCheck issues: $shellcheck_issues"

          exit_code=1
          if [ "$prettier_issues" = '0' ] && [ "$hadolint_issues" = '0' ] && [ "$shellcheck_issues" = '0' ]; then
            exit_code=0
          fi
          exit "$exit_code"
      - name: Update Slack notification
        uses: codedsolar/slack-action@7747edbf087b4facb2726870a34a1f174314b5ae # v1.5.0
        if: ${{ github.event_name != 'pull_request' && always() }}
        with:
          fields: |
            {STATUS}
            {REF}
            Node.js: ${{ steps.node.outputs.node-version }}
            Hadolint issues: ${{ steps.hadolint.outputs.issues || 'Skipped' }}
            Prettier issues: ${{ steps.prettier.outputs.issues || 'Skipped' }}
            ShellCheck issues: ${{ steps.shellcheck.outputs.issues || 'Skipped' }}
          status: ${{ job.status }}
          timestamp: ${{ steps.slack.outputs.slack-timestamp }}
